name: Native ARM CPU runtime

on:
  push:
    paths:
      - ".github/workflows/native-arm-runtime.yml"
      - "Dockerfile"
      - "requirements-production-*.txt"
      - "app/**"
      - "pipeline.py"
      - "tracker.py"
      - "accident_scorer.py"
      - "config.py"
      - "deploy/verify_cpu_runtime.py"
  pull_request:
    paths:
      - ".github/workflows/native-arm-runtime.yml"
      - "Dockerfile"
      - "requirements-production-*.txt"
      - "app/**"
      - "pipeline.py"
      - "tracker.py"
      - "accident_scorer.py"
      - "config.py"
      - "deploy/verify_cpu_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify native architecture and build production image
        run: |
          test "$(uname -m)" = aarch64
          docker build --platform linux/arm64 -t traffic-detection-cpu:ci .
          test "$(docker image inspect traffic-detection-cpu:ci --format '{{.Architecture}}')" = arm64
      - name: Verify offline non-root bounded CPU pipeline
        run: |
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 4g --pids-limit 128 \
            --tmpfs /tmp:size=256m,mode=1777 \
            --tmpfs /data:size=32m,mode=1777 \
            --mount "type=bind,source=$PWD/deploy/verify_cpu_runtime.py,target=/app/verify_cpu_runtime.py,readonly" \
            traffic-detection-cpu:ci \
            python verify_cpu_runtime.py --expected-machine aarch64
      - name: Fetch fixed noncommercial CARLA sources
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/carla-media" "$RUNNER_TEMP/carla-results"
          chmod 777 "$RUNNER_TEMP/carla-results"
          curl --fail --location --max-time 120 --max-filesize 3000000 \
            'https://www.kaggle.com/api/v1/datasets/download/picekl/accident?fileName=synthetic_videos%2Fvideos%2Fsideswipe%2FTown04_sideswipe_clear_40.mp4' \
            -o "$RUNNER_TEMP/carla-media/video.mp4"
          curl --fail --location --max-time 120 --max-filesize 10000000 \
            'https://www.kaggle.com/api/v1/datasets/download/picekl/accident/metadata-synthetic.csv' \
            -o "$RUNNER_TEMP/carla-media/metadata.csv"
          curl --fail --location --max-time 120 --max-filesize 3000000 \
            'https://www.kaggle.com/api/v1/datasets/download/picekl/accident?fileName=synthetic_videos%2Fannotations%2FTown04_sideswipe_clear_40.json%2FTown04_sideswipe_clear_40.json' \
            -o "$RUNNER_TEMP/carla-media/annotation.json"
      - name: Verify fixed source offline
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf 'FROM traffic-detection-cpu:ci\nUSER root\nRUN apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*\nUSER detector\n' > "$RUNNER_TEMP/experiment.Dockerfile"
          docker build -f "$RUNNER_TEMP/experiment.Dockerfile" -t carla-experiment .
          timeout 600 docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 4g --pids-limit 128 \
            --tmpfs /tmp:size=256m,mode=1777 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/source \
            -e INFERENCE_THREADS=2 \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/carla-media,target=/media,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/carla-results,target=/results" \
            carla-experiment python /source/deploy/sideswipe_downstream_sensitivity.py
      - name: Upload only derived numerical provenance
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sideswipe-downstream-sensitivity
          path: |
            ${{ runner.temp }}/carla-results/structure.json
            ${{ runner.temp }}/carla-results/downstream-resource.json
            ${{ runner.temp }}/carla-results/legacy/summary.json
            ${{ runner.temp }}/carla-results/legacy/carla_sideswipe/frames.jsonl
            ${{ runner.temp }}/carla-results/constant-fps/summary.json
            ${{ runner.temp }}/carla-results/constant-fps/carla_sideswipe/frames.jsonl
          if-no-files-found: error
          retention-days: 7
